name: Multi-system experiment
on:
  push:
    branches: [experiment/multi-system-menu]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y iverilog
      - run: python -m unittest discover -s experiments/multi_system -p 'test_*.py' -v
      - run: python experiments/multi_system/prepare_pages.py --out .work/multi-system/rtl
      - run: sh experiments/multi_system/run_rtl.sh
      - run: python experiments/multi_system/fetch_sources.py --out .work/multi-system/sources
      - run: python experiments/multi_system/launch_plan.py --check-upstream .work/multi-system/sources
