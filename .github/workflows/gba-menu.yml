name: GBA menu experiment
on:
  push:
    branches: [feature/gba-native-menu]
  pull_request:
    paths: [experiments/gba_menu/**, experiments/unified_frontend/**, experiments/native_routing/**, tools/**, assets/fonts/**, .github/workflows/gba-menu.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y iverilog
      - run: mkdir -p .work/native-routing && iverilog -g2012 -s tb_probe -o .work/native-routing/probe.sim experiments/native_routing/route_probe.sv experiments/native_routing/tb_probe.sv && vvp .work/native-routing/probe.sim
      - run: python -m unittest discover -s experiments/gba_menu -p 'test_*.py' -v
      - run: python experiments/multi_system/fetch_sources.py --out .work/multi-system/sources
      - run: python experiments/gba_menu/prepare_build.py --sources .work/multi-system/sources/gba --out .work/gba-menu/ci-build --integrate
      - run: python experiments/unified_frontend/prepare_gba_fade.py --sources .work/multi-system/sources/gba --out .work/gba-menu/ci-fade-build
      - run: python experiments/unified_frontend/probe_fade.py --build .work/gba-menu/ci-fade-build --out .work/unified-frontend/fade-probe
      - run: python experiments/gba_menu/probe_control.py --build .work/gba-menu/ci-build --out .work/gba-menu/ci-control
